[package]
name = "alexandria-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "alex"
path = "src/main.rs"

[dependencies]
alexandria-core = { path = "../core" }
alexandria-zim = { path = "../zim" }
alexandria-pmtiles = { path = "../pmtiles" }
alexandria-search = { path = "../search" }
sha2 = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
