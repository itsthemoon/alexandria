[package]
name = "alexandria-app"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alexandria-search = { path = "../search" }
alexandria-core = { path = "../core" }
alexandria-zim = { path = "../zim" }
alexandria-pmtiles = { path = "../pmtiles" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff"] }
